# ===================================
# NGINX Configuration for ElloMEI
# ===================================
# Este arquivo configura o Nginx como reverse proxy para a aplicação ElloMEI
# com suporte a SSL/HTTPS usando Let's Encrypt
#
# IMPORTANTE: Este é um exemplo de configuração para PRODUÇÃO
# Ajuste conforme necessário para seu ambiente
# ===================================

# Redireciona HTTP (porta 80) para HTTPS (porta 443)
server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br www.seudominio.com.br;

    # Permite acesso ao diretório .well-known para validação do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todo o resto para HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Servidor HTTPS (porta 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seudominio.com.br www.seudominio.com.br;

    # ===================================
    # Configuração SSL/TLS
    # ===================================
    
    # Certificados SSL (gerados pelo Let's Encrypt)
    # IMPORTANTE: Substitua 'seudominio.com.br' pelo seu domínio real
    ssl_certificate /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;

    # Parâmetros SSL recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # OCSP Stapling (melhora performance do SSL)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/seudominio.com.br/chain.pem;

    # Resolver DNS (use o DNS do seu provedor)
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ===================================
    # Headers de Segurança
    # ===================================
    
    # HSTS (HTTP Strict Transport Security)
    # Força o navegador a usar HTTPS por 1 ano
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Previne clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Previne MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection (legacy, mas ainda útil)
    add_header X-XSS-Protection "1; mode=block" always;

    # Content Security Policy (ajuste conforme necessário)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy (substitui Feature-Policy)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ===================================
    # Configurações de Performance
    # ===================================
    
    # Compressão GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Tamanho máximo do corpo da requisição (para uploads)
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ===================================
    # Logs
    # ===================================
    
    access_log /var/log/nginx/ellomei-access.log;
    error_log /var/log/nginx/ellomei-error.log;

    # ===================================
    # Proxy para a Aplicação Spring Boot
    # ===================================
    
    location / {
        # Proxy para o container Docker da aplicação
        # Se estiver usando Docker Compose, use o nome do serviço
        proxy_pass http://app:8080;

        # Headers necessários para o proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (se necessário no futuro)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ===================================
    # Cache de Arquivos Estáticos
    # ===================================
    
    # CSS, JavaScript, Imagens
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        
        # Cache por 1 ano (arquivos estáticos com hash no nome)
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Logs de acesso desabilitados para arquivos estáticos
        access_log off;
    }

    # ===================================
    # Endpoints Especiais
    # ===================================
    
    # Actuator (monitoramento) - RESTRITO!
    # IMPORTANTE: Em produção, proteja estes endpoints ou bloqueie completamente
    location /actuator {
        # Bloqueia acesso externo (apenas localhost)
        allow 127.0.0.1;
        deny all;
        
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    # Health check (pode ser público para load balancers)
    location /actuator/health {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        access_log off;
    }
}

# ===================================
# INSTRUÇÕES DE USO
# ===================================
#
# 1. INSTALAR NGINX:
#    sudo apt update
#    sudo apt install nginx
#
# 2. INSTALAR CERTBOT (Let's Encrypt):
#    sudo apt install certbot python3-certbot-nginx
#
# 3. COPIAR ESTE ARQUIVO:
#    sudo cp nginx.conf /etc/nginx/sites-available/ellomei
#    sudo ln -s /etc/nginx/sites-available/ellomei /etc/nginx/sites-enabled/
#
# 4. EDITAR O ARQUIVO:
#    - Substitua 'seudominio.com.br' pelo seu domínio real
#    - Ajuste o proxy_pass se necessário (ex: localhost:8080)
#
# 5. TESTAR A CONFIGURAÇÃO:
#    sudo nginx -t
#
# 6. OBTER CERTIFICADO SSL:
#    sudo certbot --nginx -d seudominio.com.br -d www.seudominio.com.br
#
# 7. REINICIAR NGINX:
#    sudo systemctl restart nginx
#
# 8. RENOVAÇÃO AUTOMÁTICA:
#    O Certbot configura automaticamente um cron job para renovar
#    os certificados antes de expirarem (a cada 90 dias)
#
# 9. TESTAR RENOVAÇÃO:
#    sudo certbot renew --dry-run
#
